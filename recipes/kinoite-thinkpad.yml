---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-thinkpad
description: Custom Fedora Kinoite image with personal tweaks - configured for hardware and use of a Thinkpad X1 Carbon 5th gen.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - from-file: common/base.yml
  - from-file: common/laptops.yml
  - from-file: common/va-intel.yml

  - type: os-release
    properties:
      DEFAULT_HOSTNAME: x1carbon

  - type: dnf
    repos:
      copr:
        - sneexy/python-validity # for open-fprintd and validity fingerprint reader support

    replace:
      # require copr:sneexy/python-validity
      - from-repo: sneexy/python-validity
        packages:
        - old: fprintd
          new: open-fprintd

    install:
      packages:
      # fingerprint reader drivers, these require copr:sneexy/python-validity
        - python3-validity
        - fprintd-clients-pam

  - type: files
    files:
      - source: thinkpad-root # patch open-fprintd-resume
        destination: /

  - type: systemd
    system:
      enabled:
        - python3-validity.service
        - open-fprintd-suspend.service
        - open-fprintd-resume.service # patched version in /etc
