---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf
    install:
      packages:
        - gutenprint-cups
        - wine # getting wine flatpak to work well is a pain icl
        - winetricks

        - steam # the flatpak struggles with some stuff like big picture

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system # flathub, only using a system repo - see base.yml for brief explanation
        install: 

        # games
          - io.itch.itch
          - org.libretro.RetroArch

          - org.kde.kmahjongg
          - org.kde.kmines
          - org.kde.ksudoku
          - org.kde.knights
          - org.kde.kbounce
          - org.kde.kpat
          - org.kde.kjumpingcube

        # security
          - io.ente.auth

        # misc, neat
          - io.github.kriptolix.Poliedros
          - com.github.cassidyjames.dippi
          - com.oppzippy.OpenSCQ30
          - app.comaps.comaps

        # kde utils
          - org.kde.kcolorchooser
          - org.kde.kcalc
          - org.kde.kamoso
          - org.kde.qrca
          - org.kde.alligator
          - org.kde.krdc

        # printing
          - net.epson.epsonscan2
          - org.kde.skanpage

        # code
          - com.vscodium.codium

        # office
          - org.mozilla.Thunderbird

        # media
          - org.kde.dragonplayer
          - org.kde.elisa

        # making
          # 3D
          - com.ultimaker.cura
          - org.freecad.FreeCAD

          # image
          - org.inkscape.Inkscape
          - org.kde.krita
          - org.gimp.GIMP
          - com.rawtherapee.RawTherapee
          - org.kde.kolourpaint

          # video
          - org.kde.subtitlecomposer

          # audio
          - org.audacityteam.Audacity
          - org.musescore.MuseScore

  - type: script
    scripts:
      - laptops-install-printer-driver-rpm.sh 
        # epson provide driver RPMs but messed up the hashing? technically dodgy asf but does work so i won't mess with it

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
