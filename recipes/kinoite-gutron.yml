---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-gutron
description: Custom Fedora Kinoite image with personal tweaks - configured for hardware and use of an intel-based PC I use as a mini-server.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 44

modules:
  - from-file: common/base.yml
  - from-file: common/va-intel.yml

  - type: os-release
    properties:
      DEFAULT_HOSTNAME: gutron

  - type: dnf
    install:
      packages:
        
        - cockpit-pcp
        - glances
        - python3-jinja2
      
      # docker
        - docker
        - docker-compose
        - runc
        - iptables-legacy

      # NAS
        - samba

      # email
        - imapfilter

  - type: files
    files:
      - source: root-gutron
        destination: /

  - type: script
    snippets:
      - "sudo chown root:root /usr/lib/firmware/edid/e241i-edid.bin"
      - "sudo ln -sfn /dev/null /etc/motd.d/cockpit"

  - type: systemd
    system:
      enabled:
      # installed software
        - smb.service
        - sshd.service
        - docker.service
        - glances.service
        

  #- type: kargs
  #  kargs:
  #    - drm.edid_firmware:edid/e241i-edid.bin
  #    - video=HDMI-A-1:1920x1080@60e
