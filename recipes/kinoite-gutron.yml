---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-gutron
description: Custom Fedora Kinoite image with personal tweaks - configured for hardware and use of an intel-based PC I use as a mini-server.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - from-file: common/base.yml
  - from-file: common/va-intel.yml

  - type: os-release
    properties:
      DEFAULT_HOSTNAME: gutron

  - type: dnf
    install:
      packages:
      # fs utils
        - ncdu
        - hd-idle
        - fatrace
        - iotop-c

      # docker
        - docker
        - docker-compose

      # NAS
        - samba

      # automations
        - yt-dlp
