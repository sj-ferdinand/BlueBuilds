---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-testbed
description: Custom Fedora Kinoite image with personal tweaks - testing image for potentially breaking changes

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - from-file: common/base.yml

  - type: os-release
    properties:
      DEFAULT_HOSTNAME: kinoite-testbed

  - type: dnf
    install:
      packages:
        - plymouth-plugin-script

  - type: files
    files:
      - source: testbed-root
        destination: /

  - type: script
    snippets:
      - "sudo plymouth-set-default-theme unified-bgrt" # apply the custom plymouth theme loaded into /usr/share/plymouth/themes earlier

  - type: initramfs