---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-testbed
description: Custom Fedora Kinoite image with personal tweaks - testing image for potentially breaking changes

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - from-file: common/base.yml

  - type: os-release
    properties:
      DEFAULT_HOSTNAME: kinoite-vm

  - type: dnf
    replace:
      - from-repo: fedora
        packages:
        - old: sddm
          new: plasma-login-manager
