---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-inspiron
description: Custom Fedora Kinoite image with personal tweaks - configured for hardware and use of a Dell Inspiron 5415.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - from-file: common/base.yml
  - from-file: common/laptops.yml
  - from-file: common/va-amd.yml

  - type: os-release
    properties:
      DEFAULT_HOSTNAME: inspiron5415

  - type: dnf
    install:
      packages:
        - rEFInd
        - rEFInd-tools
        - virt-manager
        - libvirt

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.pwr_solaar.solaar